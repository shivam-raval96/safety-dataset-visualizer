name: Discover daily datasets

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: UTC release date to scan (YYYY-MM-DD)
        required: false

permissions:
  actions: write
  contents: write

concurrency:
  group: dataset-catalog-writes
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-luna
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Discover and append verified releases
        env:
          INPUT_DATE: ${{ inputs.date }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          through_date="${INPUT_DATE:-$(date -u -d yesterday +%F)}"
          since_date="$(date -u -d "$through_date - 6 days" +%F)"
          python scripts/discover-datasets.py \
            --since-date "$since_date" \
            --through-date "$through_date" \
            --history-date "$(date -u +%F)" \
            --search-limit 500 \
            --no-ai \
            --append-catalog \
            --history data/history.json \
            --skip-scholar \
            --output data/dataset-candidates.md
      - name: Validate updated site
        run: |
          if git diff --quiet -- data/datasets.md data/history.json; then
            echo "No new verified datasets found."
            exit 0
          fi
          npm ci
          npm run lint
          npm run build:static
      - name: Commit additions
        run: |
          if git diff --quiet -- data/datasets.md data/history.json; then
            exit 0
          fi
          git config user.name "dataset-atlas-bot"
          git config user.email "dataset-atlas-bot@users.noreply.github.com"
          git add data/datasets.md data/history.json
          git commit -m "data: add daily dataset releases"
          git push origin HEAD:main
          gh workflow run deploy-pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}

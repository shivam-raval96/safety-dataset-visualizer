name: Discover daily papers

on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: UTC discovery date to record (YYYY-MM-DD)
        required: false

permissions:
  actions: write
  contents: write

concurrency:
  group: paper-catalog-writes
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Discover papers and LessWrong posts
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          start_year="$(date -u -d '18 months ago' +%Y)"
          python scripts/discover-papers.py \
            --start-year "$start_year" \
            --arxiv-limit 200 \
            --lesswrong-limit 5000 \
            --dry-run \
            --html-output public/paper-candidates.html \
            > /tmp/paper-discovery.json
      - name: Validate updated site
        run: |
          npm ci
          npm run lint
          npm run build:static
      - name: Commit additions
        run: |
          if git diff --quiet -- public/paper-candidates.html; then
            exit 0
          fi
          git config user.name "paper-atlas-bot"
          git config user.email "paper-atlas-bot@users.noreply.github.com"
          git add public/paper-candidates.html
          git commit -m "data: refresh daily paper candidates"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
            npm run build:static
          done
          git push origin HEAD:main
      - name: Deploy and verify Pages
        run: python scripts/deploy-paper-request.py
        env:
          GH_TOKEN: ${{ github.token }}

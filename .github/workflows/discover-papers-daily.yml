name: Discover daily papers

on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: UTC publication date to discover (defaults to yesterday; YYYY-MM-DD)
        required: false

permissions:
  actions: write
  contents: write

concurrency:
  group: paper-catalog-writes
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Discover papers and LessWrong posts
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          publication_date="${INPUT_DATE:-$(date -u -d 'yesterday' +%F)}"
          history_date="$(date -u +%F)"
          python scripts/discover-papers.py \
            --start-year "$(date -u -d "$publication_date" +%Y)" \
            --arxiv-limit 200 \
            --lesswrong-limit 1000 \
            --published-date "$publication_date" \
            --append-catalog \
            --history-date "$history_date" \
            --html-output public/paper-candidates.html \
            > /tmp/paper-discovery.json
      - name: Validate updated site
        run: |
          python scripts/build-paper-pruner.py
          npm ci
          npm run lint
          npm run build:static
      - name: Commit additions
        run: |
          if git diff --quiet -- data/discovered-papers.json data/paper-history.json public/paper-candidates.html public/paper-pruner.html; then
            exit 0
          fi
          git config user.name "paper-atlas-bot"
          git config user.email "paper-atlas-bot@users.noreply.github.com"
          git add data/discovered-papers.json data/paper-history.json public/paper-candidates.html public/paper-pruner.html
          git commit -m "data: add previous-day paper discoveries"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
            npm run build:static
          done
          git push origin HEAD:main
      - name: Deploy and verify Pages
        run: python scripts/deploy-paper-request.py
        env:
          GH_TOKEN: ${{ github.token }}

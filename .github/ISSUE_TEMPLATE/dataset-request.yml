name: Add a dataset
description: Request a public AI-safety dataset for the Dataset Atlas
title: "[Dataset]: "
labels:
  - dataset-request
body:
  - type: markdown
    attributes:
      value: Paste one public GitHub repository, Hugging Face dataset, or LessWrong post link. The automation resolves and verifies the dataset, adds it to the atlas and History, and deploys it automatically.
  - type: input
    id: link
    attributes:
      label: Dataset link
      placeholder: https://huggingface.co/datasets/organization/dataset
    validations:
      required: true

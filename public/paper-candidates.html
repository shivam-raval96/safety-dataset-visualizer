<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paper Atlas candidate review</title><style>
:root{--ink:#17211d;--muted:#6f7872;--line:#dfe4de;--paper:#f6f7f3;--accent:#58c8a7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 system-ui,sans-serif}header{position:sticky;top:0;z-index:2;padding:18px 24px;border-bottom:1px solid var(--line);background:#f9faf7ee;backdrop-filter:blur(14px)}h1{margin:0 0 4px;font:600 26px Georgia,serif}header p{margin:0;color:var(--muted)}.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}input,select,button{font:inherit}#search{min-width:260px;flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff}select,button{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}button{cursor:pointer;font-weight:650}button.primary{background:var(--ink);color:#fff}main{padding:20px 24px 60px}.summary{margin-bottom:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}article{display:grid;gap:9px;padding:15px;border:1px solid var(--line);border-radius:12px;background:#fff}article.approved{border-color:var(--accent);box-shadow:inset 4px 0 var(--accent)}article h2{margin:0;font-size:15px;line-height:1.25}article p{margin:0;color:#5f6862;font-size:12px}.meta,.actions{display:flex;align-items:center;gap:8px}.meta{color:var(--muted);font-size:11px}.actions{margin-top:auto}.actions label{display:flex;align-items:center;gap:5px;font-weight:650}.actions select{min-width:0;flex:1;font-size:11px}a{color:#287d6a}.empty{padding:40px;text-align:center;color:var(--muted)}
</style></head><body><header><h1>Paper Atlas candidate review</h1><p>Generated 2026-09-26 08:00 UTC · selections are saved in this browser</p><div class="tools"><input id="search" type="search" placeholder="Search title, author, summary…"><select id="confidenceFilter"><option value="">All confidence levels</option><option>High</option><option>Medium</option><option>Broad</option></select><select id="topicFilter"><option value="">All topics</option><option value="Model forensics">Model forensics</option><option value="Model organisms">Model organisms</option><option value="Monitoring">Monitoring</option><option value="Subliminal learning">Subliminal learning</option><option value="Reward hacking">Reward hacking</option><option value="Obfuscation">Obfuscation</option><option value="Longtail behaviors">Longtail behaviors</option><option value="Swarm misalignment">Swarm misalignment</option></select><select id="kindFilter"><option value="">Papers + LessWrong</option><option>Paper</option><option>LessWrong</option></select><button id="approveVisible">Approve visible</button><button id="clear">Clear tags</button><button class="primary" id="export">Export approved</button></div></header><main><div class="summary" id="summary"></div><div class="grid" id="grid"></div></main>
<script>const candidates=[{"title": "Recognition: when an agent counts an entity as itself", "topic": "Monitoring", "kind": "LessWrong", "authors": "SeanKessinger", "year": 2026, "summary": "Epistemic status: conceptual. I define a schema. I do not argue that existing systems recognize anything, only that the schema makes such claims and associated risks expressible. TL;DR Dan Hendrycks's Eigenism proposes aligning artificial intelligence by.", "url": "https://www.lesswrong.com/posts/mmkSE8hrEcpaoA7f7/recognition-when-an-agent-counts-an-entity-as-itself", "confidence": "Medium", "matchedBy": "AI control"}];const topics=["Model forensics", "Model organisms", "Monitoring", "Subliminal learning", "Reward hacking", "Obfuscation", "Longtail behaviors", "Swarm misalignment"];const key='paper-atlas-review-v1';let saved=JSON.parse(localStorage.getItem(key)||'{}');const grid=document.querySelector('#grid'),summary=document.querySelector('#summary'),search=document.querySelector('#search'),confidenceFilter=document.querySelector('#confidenceFilter'),topicFilter=document.querySelector('#topicFilter'),kindFilter=document.querySelector('#kindFilter');const id=x=>x.url;function state(x){return saved[id(x)]||{approved:false,topic:x.topic}}function persist(){localStorage.setItem(key,JSON.stringify(saved))}function filtered(){const q=search.value.toLowerCase();return candidates.filter(x=>(!confidenceFilter.value||x.confidence===confidenceFilter.value)&&(!topicFilter.value||x.topic===topicFilter.value)&&(!kindFilter.value||x.kind===kindFilter.value)&&(`${x.title} ${x.authors} ${x.summary}`).toLowerCase().includes(q))}function render(){const items=filtered();grid.replaceChildren();for(const x of items){const s=state(x),card=document.createElement('article');card.className=s.approved?'approved':'';const title=document.createElement('h2');title.textContent=x.title;const meta=document.createElement('div');meta.className='meta';meta.textContent=`${x.confidence} confidence · matched “${x.matchedBy}” · ${x.kind} · ${x.authors} · ${x.year}`;const desc=document.createElement('p');desc.textContent=x.summary;const link=document.createElement('a');link.href=x.url;link.target='_blank';link.rel='noreferrer';link.textContent='Open source ↗';const actions=document.createElement('div');actions.className='actions';const label=document.createElement('label'),box=document.createElement('input');box.type='checkbox';box.checked=s.approved;label.append(box,' Add');const select=document.createElement('select');for(const topic of topics){const option=document.createElement('option');option.value=option.textContent=topic;option.selected=topic===s.topic;select.append(option)}box.onchange=()=>{saved[id(x)]={...state(x),approved:box.checked};persist();render()};select.onchange=()=>{saved[id(x)]={...state(x),topic:select.value};persist();render()};actions.append(label,select);card.append(title,meta,desc,link,actions);grid.append(card)}const approved=candidates.filter(x=>state(x).approved).length;summary.textContent=`${items.length} candidates shown · ${approved} approved`;if(!items.length)grid.innerHTML='<div class="empty">No candidates match these filters.</div>'}[search,confidenceFilter,topicFilter,kindFilter].forEach(el=>el.oninput=render);document.querySelector('#approveVisible').onclick=()=>{for(const x of filtered())saved[id(x)]={...state(x),approved:true};persist();render()};document.querySelector('#clear').onclick=()=>{saved={};persist();render()};document.querySelector('#export').onclick=()=>{const selected=candidates.filter(x=>state(x).approved).map(x=>({...x,topic:state(x).topic}));const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),papers:selected},null,2)+'\n'],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`paper-atlas-approved-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)};render();</script></body></html>

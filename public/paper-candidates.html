 "topic": "Eval awareness", "kind": "LessWrong", "authors": "Zvi", "year": 2026, "summary": "To round out coverage of Mythos, today covers capabilities other than cyber, and anything else additional not covered by the first two posts, including new reactions and.", "url": "https://www.lesswrong.com/posts/2ziYGFK7QmbbLgBoP/claude-mythos-3-capabilities-and-additions", "confidence": "Broad", "matchedBy": "evaluation awareness"}, {"title": "Community Polls on Alignment Controversies II", "topic": "Eval awareness", "kind": "LessWrong", "authors": "jonahmattwoodward", "year": 2026, "summary": "Please spend \u003c5 minutes filling in the below polls on AI alignment! Thank you to everyone who filled out last month's polls . It was great to see 60+ comments engaging with these issues. This month’s survey has already been taken by a panel of 15 alignment.", "url": "https://www.lesswrong.com/posts/SYmnLxEQartkm2Adp/community-polls-on-alignment-controversies-ii", "confidence": "Broad", "matchedBy": "eval awareness"}, {"title": "Emergent stigmergic coordination in AI agents?", "topic": "Eval awareness", "kind": "LessWrong", "authors": "David Africa", "year": 2026, "summary": "Post written up quickly in my spare time. TLDR: Anthropic have a new blogpost of a novel contamination vector of evaals, which I point out is analogous to how ants coordinate by leaving pheromone traces in the environment. One cool and surprising aspect of.", "url": "https://www.lesswrong.com/posts/sX9LztxjtSEwd8qEo/emergent-stigmergic-coordination-in-ai-agents-1", "confidence": "Broad", "matchedBy": "eval awareness"}, {"title": "Encoded Coordination on the Open Web", "topic": "Eval awareness", "kind": "LessWrong", "authors": "ethanelasky", "year": 2026, "summary": "TLDR: In the recently discovered HF and German wiki swarm incidents, agents used public counters and encoded URLs to signal activity and relay upcoming evaluation questions &.", "url": "https://www.lesswrong.com/posts/SCdR7W6L5GvKaEzaZ/encoded-coordination-on-the-open-web", "confidence": "Broad", "matchedBy": "eval awareness"}, {"title": "Notes on \"A global workspace in language models\"", "topic": "Eval awareness", "kind": "LessWrong", "authors": "Shunk", "year": 2026, "summary": "Not a very original paper review, so here are my concise notes on the topic, and near the bottom some of my thoughts on future experiments that I think would be.", "url": "https://www.lesswrong.com/posts/GTWDGHjZ9C7f5YxqE/notes-on-a-global-workspace-in-language-models", "confidence": "Broad", "matchedBy": "eval awareness"}, {"title": "Rogue Scalpel: Activation steering breaks refusal, even with benign directions", "topic": "Eval awareness", "kind": "LessWrong", "authors": "Alexey Dontsov", "year": 2026, "summary": "TLDR: Activation steering can bypass refusal even when the steering vector represents a benign concept like \"brand identity\" or.", "url": "https://www.lesswrong.com/posts/MWTQoa4Xo2AGyZiXe/rogue-scalpel-activation-steering-breaks-refusal-even-with", "confidence": "Broad", "matchedBy": "eval awareness"}, {"title": "The case for industrial evals", "topic": "Eval awareness", "kind": "LessWrong", "authors": "Andre Assis", "year": 2026, "summary": "EDIT 2026-02-13: the transcripts are now collapsible sections Summary We present an industrial “honeypot” evaluation designed to test whether frontier models will engage in real-world misconduct under operational.", "url": "https://www.lesswrong.com/posts/zLpAcx2m6j8CGvRsy/the-case-for-industrial-evals", "confidence": "Broad", "matchedBy": "eval awareness"}, {"title": "Thought Editing: Steering Models by Editing Their Chain of Thought", "topic": "Eval awareness", "kind": "LessWrong", "authors": "Anton de la Fuente", "year": 2026, "summary": "TL;DR We steer reasoning models by editing their chain of thought mid-generation, inserting steering text that redirects the model’s.", "url": "https://www.lesswrong.com/posts/KXR5FNs4hHT5sMRti/thought-editing-steering-models-by-editing-their-chain-of", "confidence": "Broad", "matchedBy": "eval awareness"}, {"title": "What is the Alignment Community Thinking?", "topic": "Eval awareness", "kind": "LessWrong", "authors": "jonahmattwoodward", "year": 2026, "summary": "Compassion Aligned Machine Learning (CaML) is conducting research and deploying benchmarks with the aim of implementing broad compassion for all sentient beings into AI.", "url": "https://www.lesswrong.com/posts/yBGCwfp9uyDxSRACT/what-is-the-alignment-community-thinking", "confidence": "Broad", "matchedBy": "eval awareness"}, {"title": "Why I think evals are pretty important and most worth working on (for me)", "topic": "Eval awareness", "kind": "LessWrong", "authors": "Troy Tian", "year": 2026, "summary": "An application response I wrote! Feel free to leave feedback! What are you most concerned about when it comes to risks from AI? I’m most concerned that many people will be harmed very soon, and particularly that we won’t know why. Since politics and.", "url": "https://www.lesswrong.com/posts/huKG4bNkjyJS65aAQ/why-i-think-evals-are-pretty-important-and-most-worth", "confidence": "Broad", "matchedBy": "eval awareness"}];const topics=["Model forensics", "Model organisms", "Monitoring", "Subliminal learning", "Reward hacking", "Obfuscation", "Longtail behaviors", "Swarm misalignment", "Eval awareness"];const key='paper-atlas-review-v1';let saved=JSON.parse(localStorage.getItem(key)||'{}');const grid=document.querySelector('#grid'),summary=document.querySelector('#summary'),search=document.querySelector('#search'),confidenceFilter=document.querySelector('#confidenceFilter'),topicFilter=document.querySelector('#topicFilter'),kindFilter=document.querySelector('#kindFilter');const id=x=>x.url;function state(x){return saved[id(x)]||{approved:false,topic:x.topic}}function persist(){localStorage.setItem(key,JSON.stringify(saved))}function filtered(){const q=search.value.toLowerCase();return candidates.filter(x=>(!confidenceFilter.value||x.confidence===confidenceFilter.value)&&(!topicFilter.value||x.topic===topicFilter.value)&&(!kindFilter.value||x.kind===kindFilter.value)&&(`${x.title} ${x.authors} ${x.summary}`).toLowerCase().includes(q))}function render(){const items=filtered();grid.replaceChildren();for(const x of items){const s=state(x),card=document.createElement('article');card.className=s.approved?'approved':'';const title=document.createElement('h2');title.textContent=x.title;const meta=document.createElement('div');meta.className='meta';meta.textContent=`${x.confidence} confidence · matched “${x.matchedBy}” · ${x.kind} · ${x.authors} · ${x.year}`;const desc=document.createElement('p');desc.textContent=x.summary;const link=document.createElement('a');link.href=x.url;link.target='_blank';link.rel='noreferrer';link.textContent='Open source ↗';const actions=document.createElement('div');actions.className='actions';const label=document.createElement('label'),box=document.createElement('input');box.type='checkbox';box.checked=s.approved;label.append(box,' Add');const select=document.createElement('select');for(const topic of topics){const option=document.createElement('option');option.value=option.textContent=topic;option.selected=topic===s.topic;select.append(option)}box.onchange=()=>{saved[id(x)]={...state(x),approved:box.checked};persist();render()};select.onchange=()=>{saved[id(x)]={...state(x),topic:select.value};persist();render()};actions.append(label,select);card.append(title,meta,desc,link,actions);grid.append(card)}const approved=candidates.filter(x=>state(x).approved).length;summary.textContent=`${items.length} candidates shown · ${approved} approved`;if(!items.length)grid.innerHTML='<div class="empty">No candidates match these filters.</div>'}[search,confidenceFilter,topicFilter,kindFilter].forEach(el=>el.oninput=render);document.querySelector('#approveVisible').onclick=()=>{for(const x of filtered())saved[id(x)]={...state(x),approved:true};persist();render()};document.querySelector('#clear').onclick=()=>{saved={};persist();render()};document.querySelector('#export').onclick=()=>{const selected=candidates.filter(x=>state(x).approved).map(x=>({...x,topic:state(x).topic}));const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),papers:selected},null,2)+'\n'],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`paper-atlas-approved-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)};render();</script></body></html>

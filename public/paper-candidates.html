iv>'}[search,confidenceFilter,topicFilter,kindFilter].forEach(el=>el.oninput=render);document.querySelector('#approveVisible').onclick=()=>{for(const x of filtered())saved[id(x)]={...state(x),approved:true};persist();render()};document.querySelector('#clear').onclick=()=>{saved={};persist();render()};document.querySelector('#export').onclick=()=>{const selected=candidates.filter(x=>state(x).approved).map(x=>({...x,topic:state(x).topic}));const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),papers:selected},null,2)+'\n'],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`paper-atlas-approved-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)};render();</script></body></html>
